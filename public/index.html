<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Roaster</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="roast-container">
        <h1>Valorant Roaster</h1>
        <p>Enter your Riot ID to get judged.</p>

        <div class="input-group">
            <input type="text" id="riotName" placeholder="Username (e.g. YAMAHA XT660X)">
            <span class="hashtag">#</span>
            <input type="text" id="riotTag" placeholder="Tag (e.g. 660)">
        </div>

        <button id="roastBtn">Roast Me</button>

        <div id="resultBox" class="hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
